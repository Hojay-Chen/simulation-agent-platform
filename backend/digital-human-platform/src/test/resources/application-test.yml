# 测试配置: 使用隔离的 companion_test 数据库, 避免干扰运行中的服务。
spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/companion_test
    username: admin
    password: shared-secret
    # 限制测试连接池: 多个 @SpringBootTest context 各建池, 避免超过 PG max_connections
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update

app:
  # 认证: 模块测试独立启动时需要(kernel 的 JwtUtil 无默认值)
  jwt:
    secret: companion-module-test-secret-0123456789abcdef
    expiration-ms: 604800000

  # 测试一律走 Mock LLM(环境变量有 key 也不打真 LLM)
  llm:
    provider: mock
  scheduler:
    daily-reflection-cron: 0 0 0 1 1 *
    weekly-reflection-cron: 0 0 0 1 1 *
    proactive-cron: 0 0 0 1 1 *
    birthday-cron: 0 0 0 1 1 *
    life-tick-cron: 0 0 0 1 1 *
    thought-maintenance-cron: 0 0 0 1 1 *
    emotion-maintenance-cron: 0 0 0 1 1 *
    open-loop-cron: 0 0 0 1 1 *
    memory-consolidation-cron: 0 0 0 1 1 *
    event-simulation-cron: 0 0 0 1 1 *
    thread-maintenance-cron: 0 0 0 1 1 *
    unfinished-thought-cron: 0 0 0 1 1 *
    sleep-tick-cron: 0 0 0 1 1 *
    phone-tick-cron: 0 0 0 1 1 *
    scheduled-action-cron: 0 0 0 1 1 *
    pending-recheck-cron: 0 0 0 1 1 *
    memory-decay-cron: 0 0 0 1 1 *
    outbox-relay-cron: 0 0 0 1 1 *
    life-schedule-cron: 0 0 0 1 1 *
    relationship-projection-cron: 0 0 0 1 1 *
    behavior-tick-cron: 0 0 0 1 1 *
    # LAP v1 幂等调用回收 —— 测试里必须钉死, 否则 context 启动后会真的每 5 分钟扫一次库
    invocation-reaper-cron: 0 0 0 1 1 *
    # V11 信箱维护(回收租约/重放/过期清理)。测试里必须钉死: 它会真的重放 PENDING 行,
    # 于是"暂停中的 agent 一条都不处理"这条用例会被后台任务替它处理掉, 断时红时绿。
    inbox-maintenance-cron: 0 0 0 1 1 *

  # V10 §5 测试环境关闭拟人化层(单测断言预期原始输出, 不带错字/犹豫后缀)
  v10:
    human-likeness:
      typing-rhythm: false
      typos: false
      hesitation: false
      memory-drift: false
      physio-filter: false
      persona-voice: false
      persona-fingerprint: false
    hotpath:
      enabled: false
      shadow: false

  # V11 §25 送达主链开关。
  # 必须显式钉死成"两个都关": 生产默认是 shadow=true, 若测试跟着继承,
  # 则每一次消息送达都会多算一遍显著性并往 V11DeliveryShadow 里记一笔 ——
  # 不写库、不发事件, 所以不会让用例变红, 但会让"这条用例到底验证了哪条路径"
  # 变成一个需要推理的问题。要测 V11 路径的用例自己用 @TestPropertySource 打开。
  v11:
    runtime:
      enabled: false
      shadow: false
    # 同上: 两个都钉死。turns.shadow 生产默认 true, 继承过来的话每个送达都会多跑一遍
    # 聚合状态机, 于是"这条用例验证的是合并还是没合并"变得要读完配置才知道。
    # 窗口值刻意用出厂默认 —— 要测别的时序的用例自己传 now, 不靠改配置。
    turns:
      enabled: false
      shadow: false
    # Phase 4 同理钉死。cognition.shadow 生产默认 true, 而 shadow 会调 planner 与
    # 去重器 —— 对绝大多数用例那是无关的一次计算, 但对"断言某条链上发生了哪些交互"的
    # 用例它就是一条多余的交互。要测决策的用例自己构造 planner/recorder, 不走配置。
    cognition:
      enabled: false
      shadow: false
