// openapi —— 对外 OpenAPI 服务（第 2 个服务, 端口 8092）。
//
// 用户拍板: 仿真 Agent 平台对外提供的 openapi 与规则(三方创建/删除/管理/使用
// 自己的仿真 agent)从平台主体独立出来, 单独构建单独运行。
// G2 先立骨架(启动类 + 健康端点 + 同库数据面); 业务端点 = G4。

plugins {
    id 'org.springframework.boot'
}

dependencies {
    // G4: 引入 digital-human 的 persona/llm/state/relationship/auth 子集 ——
    // 编译依赖整模块, 但启动类 scanBasePackages 显式白名单(persona/llm/state/
    // relationship/auth + common), 认知链包(runtime/cognition/life/behavior/scheduler)
    // 不进本服务。边界守卫(check-agent.sh)静态断言这一点。
    implementation project(':common')
    implementation project(':digital-human')

    // springdoc: OpenAPI 3.1 spec + /docs UI(README G4 指定)。1.7.x 是 SB 2.7 兼容线。
    implementation 'org.springdoc:springdoc-openapi-webmvc-core:1.7.0'
    implementation 'org.springdoc:springdoc-openapi-ui:1.7.0'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

bootJar {
    archiveBaseName = 'simulation-agent-openapi'
    archiveVersion = '1.0.0'
    mainClass = 'com.luxera.agentopenapi.AgentOpenApiApplication'
}
