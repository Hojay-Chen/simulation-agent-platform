# 仿真 Agent 平台 (agent.luxera.top) — 仓 2 (simulation-agent-platform)
#
# 与 companion.conf (仓 1 聊天平台) 并存, 互不干扰 —— 两套前端、两个域名。
#
# 两个上游, 同在 /api/ 之下, 靠前缀长度分开(G8):
#
#   /api/v1/openapi/** → 8092  对外 OpenAPI 产品面(管理钥 / sap_ 客户端钥)
#   /api/health        → 8092  探活(两个服务都有该路径的语义, 8092 有实现)
#   /api/**            → 8091  平台自身功能面(companions / admin / v10, 用户 JWT)
#
# 为什么 8091 也要在本域暴露: "仿真 agent 自己一个域名" —— 它自己那套功能
# API 属于它自己的域。注意线上**浏览器不会走到这里**: 聊天平台的前端只调
# 聊天平台后端, 伴侣域请求由 8081 在服务端转给 8091(G8)。这里的入口是给
# 直接使用仿真 Agent 平台的调用方(JWT 用户 / 运维)留的。
#
# ⚠️ 只映射 /api/**, 不要写成 / —— 8091 的 /internal/** 是 HMAC 守护的服务间
# 面(ServerSecurityConfig 里 permitAll + InternalAuthFilter 验签), 它**不在**
# /api/ 前缀下, 因此落进下面的 location /(Authelia 门 + SPA), 不会被暴露。
# 若哪天把 /internal/ 也代理出去, 就等于把一个本应内网的服务间接口挂上公网,
# 只靠一把 HMAC 密钥挡着。
#
# ⚠️ 鉴权分层是本配置最要紧的一件事, 别照抄 companion.conf 的思路乱改:
#
#   人(浏览器) → 控制台静态页 → Authelia 前门
#   机器(三方) → /api/**       → **不套 Authelia**, 由 API Key / JWT 自己把关
#
# 为什么 /api/ 不能套 Authelia: 那会把整个对外 OpenAPI 产品打死。
# 三方用 curl / SDK 带 Bearer sap_... 调过来, 得到的会是 302 跳到 Authelia
# 登录页, 而不是 401 —— 机器客户端无法完成浏览器登录, 接入第一步就断。
# 8092 的 OpenApiAuthFilter 已经是这道门的正确看门人(401 语义清晰)。
# 所以: 静态页套登录, API 面裸奔给钥匙 —— 与仓 1 的 MCP / Developer API
# 同一条哲学。

# ── HTTP → HTTPS ───────────────────────────
server {
    listen 80;
    server_name agent.luxera.top;
    return 301 https://agent.luxera.top$request_uri;
}

server {
    listen 443 ssl;
    server_name agent.luxera.top;

    ssl_certificate     /etc/nginx/ssl/luxera-top/luxera-top.crt;
    ssl_certificate_key /etc/nginx/ssl/luxera-top/luxera-top.key;

    # 控制台静态文件 (仓 2 frontend 的 Vite build 产物)
    root /var/www/agent;
    index index.html;

    # Authelia 子请求 (与前门配置同款, 见 clash.conf / harness.conf)
    location = /__authelia_verify {
        internal;
        proxy_pass http://127.0.0.1:9091/api/authz/auth-request;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Original-Method $request_method;
    }

    # ── API: 对外面, **不套 Authelia** (理由见文件头) ──────────────
    #
    # 顺序无关但前缀长度有关: nginx 选最长匹配的 location, 所以
    # /api/v1/openapi/clients 命中第三条而不是最后一条 —— 不用靠书写顺序。
    # = 精确匹配优先于任何前缀匹配, 所以 /api/health 单列。

    # 探活: 8092 有 HealthController。必须单列 —— 否则会被下面的 /api/ 抢去
    # 8091, 而 8091 只在 SecurityConfig 里 permitAll 了该路径、并没有这个
    # 控制器, 结果是 404。控制台启动时的健康探测就靠它。
    location = /api/health {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 对外 OpenAPI 产品面 (G4): 管理面 X-Admin-Key 与客户端面 Bearer sap_...
    # 由 8092 的 OpenApiAuthFilter 分别校验, nginx 不参与鉴权判断。
    location /api/v1/openapi/ {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 8092 是纯 REST, 无 SSE/流式面 —— 故不关缓冲。将来若加流式通道,
        # 要和下面那条一样关。
        proxy_read_timeout 60s;
    }

    # 平台自身功能面 (8091): companions / admin / v10 等, 用户 JWT 把关。
    # **这里必须关缓冲** —— /api/companions/{id}/conversations/{cid}/chat 是
    # SseEmitter 流式(边想边说, 300s), 缓冲会把流式聊天变成"等想完一次性吐出",
    # 认知链的可观测性就没了。(同前缀下的 /conversations/first 不是流式: 它开或
    # 复用会话, 回一份 ConversationView 的 JSON。)
    location /api/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ── 接口文档: 公开 (spec 不含密钥; 三方接入第一步就是看文档) ──────
    #
    # ⚠️ /swagger-ui/ 必须一起代理 —— springdoc 的 /docs 不是页面, 是个 302:
    #   GET /docs → 302 Location: /swagger-ui/index.html
    # 少这条, 浏览器会跟着跳到 /swagger-ui/index.html, 那里没被代理, 于是落进
    # 下面的 location / (Authelia 门) → 未登录者被弹去登录页, 登录后又拿到
    # 一张 SPA 的 HTML 而不是文档页。文档面等于废掉, 且症状是"登录了也没用",
    # 与鉴权配置无关却看着像鉴权问题。
    location = /docs {
        proxy_pass http://127.0.0.1:8092/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /docs/ {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /swagger-ui/ {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /swagger-ui {
        proxy_pass http://127.0.0.1:8092/swagger-ui/index.html;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /v3/api-docs {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 控制台 SPA: 套 Authelia (管理面, 手里能攥管理钥) ────────────
    location / {
        auth_request /__authelia_verify;
        auth_request_set $authelia_redirect $upstream_http_location;
        error_page 401 =302 $authelia_redirect;

        try_files $uri $uri/ /index.html;
    }

    # HTML 不缓存。
    #
    # ⚠️ 这里也必须带 auth_request —— 精确匹配 (=) 的优先级高于前缀匹配 (/),
    # 直接 GET /index.html 会绕过 / 那条规则。少了它, 未登录者照样能拿到
    # 控制台的 HTML 外壳(拿不到数据, 但门形同虚设)。companion.conf 里没这条
    # 是因为那个站本来就整个裸奔, 不是因为可以不写。
    location = /index.html {
        auth_request /__authelia_verify;
        auth_request_set $authelia_redirect $upstream_http_location;
        error_page 401 =302 $authelia_redirect;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # 静态资源带 hash 长缓存。
    # 这一条**有意不套 Authelia**: 带 hash 的 JS/CSS 不含任何密钥(钥匙是用户
    # 运行时输入的), 且入口 HTML 已被拦住 —— 未登录者拿到 JS 也走不到 API。
    # 套上会让每次登录跳转都重新校验一遍十几个静态文件, 白付延迟。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
